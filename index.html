<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grocery POS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <div>
            <h1>🛒 Grocery POS</h1>
            <p>Shop Management System</p>
        </div>

        <div class="date" id="date"></div>
    </header>

    <main class="container">

        <!-- Dashboard -->
        <section class="dashboard">

            <div class="card">
                <span>📦 Products</span>
                <strong id="productCount">0</strong>
            </div>

            <div class="card">
                <span>💰 Today's Sales</span>
                <strong id="todaySales">Rs. 0.00</strong>
            </div>

            <div class="card">
                <span>📊 Stock Items</span>
                <strong id="stockCount">0</strong>
            </div>

            <div class="card">
                <span>⚠️ Low Stock</span>
                <strong id="lowStock">0</strong>
            </div>

        </section>


        <!-- Add Product -->
        <section class="panel">

            <h2>➕ Add Product</h2>

            <form id="productForm">

                <input
                    type="text"
                    id="productName"
                    placeholder="Product Name"
                    required
                >

                <input
                    type="text"
                    id="barcode"
                    placeholder="Barcode"
                    required
                >

                <input
                    type="text"
                    id="category"
                    placeholder="Category"
                >

                <input
                    type="number"
                    id="buyPrice"
                    placeholder="Buying Price"
                    min="0"
                    step="0.01"
                    required
                >

                <input
                    type="number"
                    id="sellPrice"
                    placeholder="Selling Price"
                    min="0"
                    step="0.01"
                    required
                >

                <input
                    type="number"
                    id="stock"
                    placeholder="Stock Quantity"
                    min="0"
                    required
                >

                <button type="submit">
                    Add Product
                </button>

            </form>

        </section>


        <!-- Search -->
        <section class="panel">

            <h2>🔎 Search Product</h2>

            <input
                type="text"
                id="search"
                placeholder="Enter product name or barcode..."
            >

        </section>


        <!-- Product List -->
        <section class="panel">

            <h2>📦 Products</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Barcode</th>
                            <th>Category</th>
                            <th>Buy</th>
                            <th>Sell</th>
                            <th>Stock</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="productTable">
                        <!-- Products will appear here -->
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="app.js"></script>

</body>
</html>
