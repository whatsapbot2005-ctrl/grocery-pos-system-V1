<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grocery POS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="topbar">

        <div>
            <h1>🛒 Grocery POS</h1>
            <p>Shop Management System</p>
        </div>

        <div class="date" id="date"></div>

    </header>


    <main class="container">


        <!-- ========================= -->
        <!-- DASHBOARD -->
        <!-- ========================= -->

        <section class="dashboard">

            <div class="card">
                <span>📦 Products</span>
                <strong id="productCount">0</strong>
            </div>

            <div class="card">
                <span>💰 Today's Sales</span>
                <strong id="todaySales">Rs. 0.00</strong>
            </div>

            <div class="card">
                <span>📊 Stock Items</span>
                <strong id="stockCount">0</strong>
            </div>

            <div class="card">
                <span>⚠️ Low Stock</span>
                <strong id="lowStock">0</strong>
            </div>

        </section>



        <!-- ========================= -->
        <!-- ADD PRODUCT -->
        <!-- ========================= -->

        <section class="panel">

            <h2>➕ Add Product</h2>

            <form id="productForm">

                <input
                    type="text"
                    id="productName"
                    placeholder="Product Name"
                    required
                >

                <input
                    type="text"
                    id="barcode"
                    placeholder="Barcode"
                    required
                >

                <input
                    type="text"
                    id="category"
                    placeholder="Category"
                >

                <input
                    type="number"
                    id="buyPrice"
                    placeholder="Buying Price"
                    min="0"
                    step="0.01"
                    required
                >

                <input
                    type="number"
                    id="sellPrice"
                    placeholder="Selling Price"
                    min="0"
                    step="0.01"
                    required
                >

                <input
                    type="number"
                    id="stock"
                    placeholder="Stock Quantity"
                    min="0"
                    required
                >

                <button type="submit">
                    Add Product
                </button>

            </form>

        </section>



        <!-- ========================= -->
        <!-- SEARCH PRODUCT -->
        <!-- ========================= -->

        <section class="panel">

            <h2>🔎 Search Product</h2>

            <input
                type="text"
                id="search"
                placeholder="Enter product name or barcode..."
            >

        </section>



        <!-- ========================= -->
        <!-- NEW SALE / POS -->
        <!-- ========================= -->

        <section class="panel">

            <h2>🛒 New Sale</h2>


            <!-- Barcode Search -->

            <div class="sale-search">

                <input
                    type="text"
                    id="saleBarcode"
                    placeholder="Enter barcode..."
                >

                <button
                    type="button"
                    onclick="addToCart()"
                >
                    Add to Cart
                </button>

            </div>


            <!-- CART -->

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Qty</th>
                            <th>Total</th>
                            <th>Action</th>
                        </tr>

                    </thead>


                    <tbody id="cartTable">

                        <tr>

                            <td
                                colspan="5"
                                style="text-align:center;"
                            >
                                Cart is empty
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>


            <!-- SALE SUMMARY -->

            <div class="sale-summary">

                <h3>
                    Total:
                    <span id="cartTotal">
                        Rs. 0.00
                    </span>
                </h3>


                <input
                    type="number"
                    id="cashReceived"
                    placeholder="Cash Received"
                    min="0"
                    step="0.01"
                >


                <h3>
                    Change:
                    <span id="changeAmount">
                        Rs. 0.00
                    </span>
                </h3>


                <button
                    type="button"
                    onclick="completeSale()"
                >
                    ✅ Complete Sale
                </button>

            </div>

        </section>



        <!-- ========================= -->
        <!-- PRODUCT LIST -->
        <!-- ========================= -->

        <section class="panel">

            <h2>📦 Products</h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Product</th>
                            <th>Barcode</th>
                            <th>Category</th>
                            <th>Buy</th>
                            <th>Sell</th>
                            <th>Stock</th>
                            <th>Action</th>
                        </tr>

                    </thead>


                    <tbody id="productTable">

                        <!-- Products will appear here -->

                    </tbody>

                </table>

            </div>

        </section>


    </main>


    <!-- JAVASCRIPT -->

    <script src="app.js"></script>

</body>

</html>
